<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      rapidContentGen vertical template (9:16, Reels / Shorts / TikTok).
      Built from the mop-star-trailer job. Conventions:
        - Text never enters the bottom 20% (y >= 1536) or the right 180 px (x >= 900):
          that is where the app buttons and caption UI sit. The text safe box is
          x 64..900 (width 836); the top 192 px is kept clear for the app header.
        - Text cards are FLAT: the .clip element holds the spans directly
          (no nested div), and GSAP animates the spans, never the .clip.
        - Footage sits in an untimed .shot wrapper; camera moves animate the wrapper.
        - Audio: a data-automation volume lane gives ABSOLUTE levels and overrides
          data-volume. Check the mix with `node tools/rcg.mjs mix-check index.html`
          before rendering.
      Replace JOB_DURATION, the shot list, cards and audio for each job.
    -->
    <style>
      :root {
        --safe-left: 64px;
        --safe-width: 836px;
        --band-top: 220px;
        --band-height: 200px;
        --ink: #f4efe4;
        --font-display: "EB Garamond", Garamond, serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: var(--font-display);
      }
      .shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 50% 40%;
      }
      .shot video,
      .shot img {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .bar {
        position: absolute;
        left: 0;
        width: 1080px;
        background: #000;
        z-index: 50;
      }
      #bar-top {
        top: 0;
        height: 192px;
      }
      #bar-bottom {
        top: 1536px;
        height: 384px;
      }
      .card {
        position: absolute;
        left: var(--safe-left);
        width: var(--safe-width);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 60;
      }
      .card.center {
        top: 660px;
        height: 400px;
      }
      .card.top {
        top: var(--band-top);
        height: var(--band-height);
      }
      .txt {
        text-align: center;
        color: var(--ink);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        line-height: 1.08;
        text-shadow:
          0 2px 16px rgba(0, 0, 0, 0.85),
          0 0 28px rgba(255, 236, 200, 0.28);
      }
      .txt span {
        display: block;
        width: var(--safe-width);
      }
      #t1.txt {
        font-size: 96px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12.8"
      data-width="1080"
      data-height="1920"
    >
      <!-- Shots: one untimed wrapper per clip; the video element carries the timing. -->
      <div id="w1" class="shot">
        <video
          id="v1"
          class="clip"
          src="assets/101066-video-1080.mp4"
          data-start="0"
          data-duration="12.8"
          data-media-start="0"
          data-track-index="0"
          muted
          playsinline
          data-color-grading='{"preset":"deep-contrast","intensity":0.5,"adjust":{"exposure":0.12,"contrast":0.12,"highlights":-0.1,"shadows":-0.02,"temperature":0.22,"vibrance":0.15},"details":{"vignette":0.25,"grain":0.15,"grainSize":0.22,"grainRoughness":0.6}}'
        ></video>
      </div>

      <!-- Voiceover (leveled to -14 LUFS) and music bed ducked under speech -->
      <audio id="vo1" src="assets/voice/vo1.wav" data-start="0.4" data-duration="2.325" data-track-index="20"></audio>
      <audio id="vo2" src="assets/voice/vo2.wav" data-start="3.1" data-duration="2.581" data-track-index="20"></audio>
      <audio id="vo3" src="assets/voice/vo3.wav" data-start="6.3" data-duration="1.6" data-track-index="20"></audio>
      <audio id="vo4" src="assets/voice/vo4.wav" data-start="9.5" data-duration="2.069" data-track-index="20"></audio>
      <audio id="music" src="assets/song-limited.wav" data-start="0" data-duration="12.8" data-track-index="21"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.0},{"t":0.25,"v":0.324},{"t":7.95,"v":0.324},{"t":8.25,"v":0.72},{"t":9.15,"v":0.72},{"t":9.4,"v":0.324},{"t":11.65,"v":0.324},{"t":11.95,"v":0.78},{"t":12.3,"v":0.78},{"t":12.8,"v":0.0}]}]}'></audio>
      <div id="cap-vo1" data-composition-id="cap-vo1" data-composition-src="compositions/cap-vo1.html" data-start="0.4" data-duration="2.43" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="cap-vo2" data-composition-id="cap-vo2" data-composition-src="compositions/cap-vo2.html" data-start="3.1" data-duration="2.63" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="cap-vo3" data-composition-id="cap-vo3" data-composition-src="compositions/cap-vo3.html" data-start="6.3" data-duration="3.66" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="cap-vo4" data-composition-id="cap-vo4" data-composition-src="compositions/cap-vo4.html" data-start="9.5" data-duration="2.11" data-track-index="30" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Text card: ease in, slow drift, fade out before the clip ends.
      function card(sel, start, dur) {
        const el = sel + " > span";
        tl.fromTo(el, { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, start);
        tl.to(el, { scale: 0.97, duration: dur - 0.45, ease: "none" }, start + 0.45);
        tl.to(el, { opacity: 0, duration: 0.25, ease: "power1.in" }, start + dur - 0.25);
      }
      
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
