<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      rapidContentGen vertical template (9:16, Reels / Shorts / TikTok).
      Built from the mop-star-trailer job. Conventions:
        - Text never enters the bottom 20% (y >= 1536) or the right 180 px (x >= 900):
          that is where the app buttons and caption UI sit. The text safe box is
          x 64..900 (width 836); the top 192 px is kept clear for the app header.
        - Text cards are FLAT: the .clip element holds the spans directly
          (no nested div), and GSAP animates the spans, never the .clip.
        - Footage sits in an untimed .shot wrapper; camera moves animate the wrapper.
        - Comments in this file never contain literal tags (a regex edit once
          matched a tag inside a comment and commented out the footage).
        - Audio: a data-automation volume lane gives ABSOLUTE levels and overrides
          data-volume. Check the mix with `node tools/rcg.mjs mix-check index.html`
          before rendering.
      Replace JOB_DURATION, the shot list, cards and audio for each job.
    -->
    <style>
      :root {
        --safe-left: 64px;
        --safe-width: 836px;
        --band-top: 220px;
        --band-height: 200px;
        --ink: #f4efe4;
        --font-display: "EB Garamond", Garamond, serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: var(--font-display);
      }
      .shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 50% 40%;
      }
      .shot video,
      .shot img {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .bar {
        position: absolute;
        left: 0;
        width: 1080px;
        background: #000;
        z-index: 50;
      }
      #bar-top {
        top: 0;
        height: 192px;
      }
      #bar-bottom {
        top: 1536px;
        height: 384px;
      }
      .card {
        position: absolute;
        left: var(--safe-left);
        width: var(--safe-width);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 60;
      }
      .card.center {
        top: 660px;
        height: 400px;
      }
      .card.top {
        top: var(--band-top);
        height: var(--band-height);
      }
      .txt {
        text-align: center;
        color: var(--ink);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        line-height: 1.08;
        text-shadow:
          0 2px 16px rgba(0, 0, 0, 0.85),
          0 0 28px rgba(255, 236, 200, 0.28);
      }
      .txt span {
        display: block;
        width: var(--safe-width);
      }
      #t1.txt {
        font-size: 96px;
      }
    </style>
      <style data-rcg-style="vox-parallax">
      :root { --orange: #f0500d; --orange-deep: #e42806; --slate: #405a64; --sky: #5f8fab; --ink: #22201d; --paper: #d6cdbb; --cardboard: #a5825a; --white: #ffffff; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="1080" data-height="1920">
      <!-- Voice: leveled Kokoro lines (rcg voice say + rcg level -14 / -3.6). -->
      <audio id="vo1" src="assets/voice/vo1.wav" data-start="0.3" data-duration="2.027" data-track-index="22"></audio>
      <audio id="vo2" src="assets/voice/vo2.wav" data-start="4.4" data-duration="2.709" data-track-index="22"></audio>
      <audio id="vo3" src="assets/voice/vo3.wav" data-start="8.2" data-duration="1.664" data-track-index="22"></audio>
      <audio id="vo4" src="assets/voice/vo4.wav" data-start="10.7" data-duration="1.899" data-track-index="22"></audio>
      <div id="px1" data-composition-id="px1" data-composition-src="compositions/px1.html" data-start="0" data-duration="4.2" data-track-index="20" data-width="1080" data-height="1920"></div>
      <div id="t1" data-composition-id="t1" data-composition-src="compositions/t1.html" data-start="0.25" data-duration="3.9" data-track-index="20" data-width="1080" data-height="1920"></div>
      <div id="hl1" data-composition-id="hl1" data-composition-src="compositions/hl1.html" data-start="1.6" data-duration="2.5" data-track-index="20" data-width="1080" data-height="1920"></div>
      <audio id="hl1-sfx" src="assets/sfx/whoosh-short.mp3" data-start="1.48" data-duration="0.57" data-volume="0.12" data-track-index="40"></audio>
      <div id="px2" data-composition-id="px2" data-composition-src="compositions/px2.html" data-start="4.2" data-duration="3.8" data-track-index="20" data-width="1080" data-height="1920"></div>
      <div id="bd1" data-composition-id="bd1" data-composition-src="compositions/bd1.html" data-start="8" data-duration="2.5" data-track-index="20" data-width="1080" data-height="1920"></div>
      <div id="pc1" data-composition-id="pc1" data-composition-src="compositions/pc1.html" data-start="8" data-duration="2.5" data-track-index="20" data-width="1080" data-height="1920"></div>
      <audio id="pc1-sfx" src="assets/sfx/whoosh-short.mp3" data-start="8.08" data-duration="0.57" data-volume="0.14" data-track-index="40"></audio>
      <div id="bd2" data-composition-id="bd2" data-composition-src="compositions/bd2.html" data-start="10.5" data-duration="2.5" data-track-index="20" data-width="1080" data-height="1920"></div>
      <div id="ar1" data-composition-id="ar1" data-composition-src="compositions/ar1.html" data-start="10.5" data-duration="2.5" data-track-index="20" data-width="1080" data-height="1920"></div>
      <div id="hl2" data-composition-id="hl2" data-composition-src="compositions/hl2.html" data-start="11" data-duration="2" data-track-index="20" data-width="1080" data-height="1920"></div>
      <audio id="hl2-sfx" src="assets/sfx/whoosh-short.mp3" data-start="10.88" data-duration="0.57" data-volume="0.12" data-track-index="40"></audio>
      <div id="cap-vo1" data-composition-id="cap-vo1" data-composition-src="compositions/cap-vo1.html" data-start="0.3" data-duration="2.19" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="cap-vo2" data-composition-id="cap-vo2" data-composition-src="compositions/cap-vo2.html" data-start="4.4" data-duration="2.95" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="cap-vo3" data-composition-id="cap-vo3" data-composition-src="compositions/cap-vo3.html" data-start="8.2" data-duration="1.79" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="cap-vo4" data-composition-id="cap-vo4" data-composition-src="compositions/cap-vo4.html" data-start="10.7" data-duration="1.99" data-track-index="30" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
