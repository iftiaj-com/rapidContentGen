<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      rapidContentGen vertical template (9:16, Reels / Shorts / TikTok).
      Built from the mop-star-trailer job. Conventions:
        - Text never enters the bottom 20% (y >= 1536) or the right 180 px (x >= 900):
          that is where the app buttons and caption UI sit. The text safe box is
          x 64..900 (width 836); the top 192 px is kept clear for the app header.
        - Text cards are FLAT: the .clip element holds the spans directly
          (no nested div), and GSAP animates the spans, never the .clip.
        - Footage sits in an untimed .shot wrapper; camera moves animate the wrapper.
        - Comments in this file never contain literal tags (a regex edit once
          matched a tag inside a comment and commented out the footage).
        - Audio: a data-automation volume lane gives ABSOLUTE levels and overrides
          data-volume. Check the mix with `node tools/rcg.mjs mix-check index.html`
          before rendering.
      Replace JOB_DURATION, the shot list, cards and audio for each job.
    -->
    <style>
      :root {
        --safe-left: 64px;
        --safe-width: 836px;
        --band-top: 220px;
        --band-height: 200px;
        --ink: #f4efe4;
        --font-display: "EB Garamond", Garamond, serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: var(--font-display);
      }
      .shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 50% 40%;
      }
      .shot video,
      .shot img {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .bar {
        position: absolute;
        left: 0;
        width: 1080px;
        background: #000;
        z-index: 50;
      }
      #bar-top {
        top: 0;
        height: 192px;
      }
      #bar-bottom {
        top: 1536px;
        height: 384px;
      }
      .card {
        position: absolute;
        left: var(--safe-left);
        width: var(--safe-width);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 60;
      }
      .card.center {
        top: 660px;
        height: 400px;
      }
      .card.top {
        top: var(--band-top);
        height: var(--band-height);
      }
      .txt {
        text-align: center;
        color: var(--ink);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        line-height: 1.08;
        text-shadow:
          0 2px 16px rgba(0, 0, 0, 0.85),
          0 0 28px rgba(255, 236, 200, 0.28);
      }
      .txt span {
        display: block;
        width: var(--safe-width);
      }
      #t1.txt {
        font-size: 96px;
      }
    </style>
      <style data-rcg-style="quiet-editorial">
      :root { --canvas: #f7f7f6; --ink: #0d0d0d; --muted: #6b6b6b; --border: #d9d9d6; --quiet: #f5f5f3; --active: #ffffff; --success: #10a37f; --success-deep: #0c8066; --shadow-soft: rgba(0, 0, 0, 0.06); --shadow-raised: rgba(0, 0, 0, 0.12); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="14.4"
      data-width="1080"
      data-height="1920"
    >
      <!-- Shots: one untimed wrapper per clip; the video element carries the timing. -->
      <div id="w1" class="shot">
        <video id="v1" class="clip" src="assets/Video_for_testing.mp4" data-start="0" data-duration="14.4" data-media-start="0" data-track-index="0" muted playsinline></video>
      </div>

      <!-- Voice: leveled Kokoro lines (rcg voice say + rcg level -14 / -3.6). -->
      <audio id="vo1" src="assets/voice/vo1.wav" data-start="0.3" data-duration="1.6" data-track-index="22"></audio>
      <audio id="vo2" src="assets/voice/vo2.wav" data-start="3.3" data-duration="1.664" data-track-index="22"></audio>
      <audio id="vo3" src="assets/voice/vo3.wav" data-start="6.3" data-duration="1.621" data-track-index="22"></audio>
      <audio id="vo4" src="assets/voice/vo4.wav" data-start="9.3" data-duration="2.005" data-track-index="22"></audio>
      <audio id="vo5" src="assets/voice/vo5.wav" data-start="12.3" data-duration="1.067" data-track-index="22"></audio>
      <div id="h1" data-composition-id="h1" data-composition-src="compositions/h1.html" data-start="0.1" data-duration="2.9" data-track-index="20" data-width="1080" data-height="1920"></div>
      <div id="c1" data-composition-id="c1" data-composition-src="compositions/c1.html" data-start="3" data-duration="9" data-track-index="20" data-width="1080" data-height="1920"></div>
      <div id="h2" data-composition-id="h2" data-composition-src="compositions/h2.html" data-start="3.1" data-duration="2.9" data-track-index="20" data-width="1080" data-height="1920"></div>
      <div id="d1" data-composition-id="d1" data-composition-src="compositions/d1.html" data-start="3.4" data-duration="2.6" data-track-index="20" data-width="1080" data-height="1920"></div>
      <div id="h3" data-composition-id="h3" data-composition-src="compositions/h3.html" data-start="6" data-duration="3" data-track-index="20" data-width="1080" data-height="1920"></div>
      <div id="l1" data-composition-id="l1" data-composition-src="compositions/l1.html" data-start="6.1" data-duration="2.9" data-track-index="20" data-width="1080" data-height="1920"></div>
      <audio id="l1-sfx" src="assets/sfx/click-soft.mp3" data-start="7.5" data-duration="0.37" data-volume="0.3" data-track-index="40"></audio>
      <audio id="l1-sfx2" src="assets/sfx/chime.mp3" data-start="7.49" data-duration="2.5" data-volume="0.22" data-track-index="41"></audio>
      <div id="win1" data-composition-id="win1" data-composition-src="compositions/win1.html" data-start="9" data-duration="3" data-track-index="20" data-width="1080" data-height="1920"></div>
      <div id="pg1" data-composition-id="pg1" data-composition-src="compositions/pg1.html" data-start="9.2" data-duration="2.8" data-track-index="20" data-width="1080" data-height="1920"></div>
      <audio id="pg1-sfx" src="assets/sfx/chime.mp3" data-start="10.84" data-duration="2.5" data-volume="0.22" data-track-index="40"></audio>
      <div id="st1" data-composition-id="st1" data-composition-src="compositions/st1.html" data-start="12.2" data-duration="2.1" data-track-index="20" data-width="1080" data-height="1920"></div>
      <audio id="st1-sfx" src="assets/sfx/chime.mp3" data-start="11.84" data-duration="2.5" data-volume="0.22" data-track-index="41"></audio>
      <div id="cap-vo1" data-composition-id="cap-vo1" data-composition-src="compositions/cap-vo1.html" data-start="0.3" data-duration="1.77" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="cap-vo2" data-composition-id="cap-vo2" data-composition-src="compositions/cap-vo2.html" data-start="3.3" data-duration="1.79" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="cap-vo3" data-composition-id="cap-vo3" data-composition-src="compositions/cap-vo3.html" data-start="6.3" data-duration="1.77" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="cap-vo4" data-composition-id="cap-vo4" data-composition-src="compositions/cap-vo4.html" data-start="9.3" data-duration="2.17" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="cap-vo5" data-composition-id="cap-vo5" data-composition-src="compositions/cap-vo5.html" data-start="12.3" data-duration="1.25" data-track-index="30" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
