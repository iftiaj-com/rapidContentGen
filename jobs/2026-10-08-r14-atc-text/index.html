<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      rapidContentGen vertical template (9:16, Reels / Shorts / TikTok).
      Built from the mop-star-trailer job. Conventions:
        - Text never enters the bottom 20% (y >= 1536) or the right 180 px (x >= 900):
          that is where the app buttons and caption UI sit. The text safe box is
          x 64..900 (width 836); the top 192 px is kept clear for the app header.
        - Text cards are FLAT: the .clip element holds the spans directly
          (no nested div), and GSAP animates the spans, never the .clip.
        - Footage sits in an untimed .shot wrapper; camera moves animate the wrapper.
        - Comments in this file never contain literal tags (a regex edit once
          matched a tag inside a comment and commented out the footage).
        - Audio: a data-automation volume lane gives ABSOLUTE levels and overrides
          data-volume. Check the mix with `node tools/rcg.mjs mix-check index.html`
          before rendering.
      Replace JOB_DURATION, the shot list, cards and audio for each job.
    -->
    <style>
      :root {
        --safe-left: 64px;
        --safe-width: 836px;
        --band-top: 220px;
        --band-height: 200px;
        --ink: #f4efe4;
        --font-display: "EB Garamond", Garamond, serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: var(--font-display);
      }
      .shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 50% 40%;
      }
      .shot video,
      .shot img {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .bar {
        position: absolute;
        left: 0;
        width: 1080px;
        background: #000;
        z-index: 50;
      }
      #bar-top {
        top: 0;
        height: 192px;
      }
      #bar-bottom {
        top: 1536px;
        height: 384px;
      }
      .card {
        position: absolute;
        left: var(--safe-left);
        width: var(--safe-width);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 60;
      }
      .card.center {
        top: 660px;
        height: 400px;
      }
      .card.top {
        top: var(--band-top);
        height: var(--band-height);
      }
      .txt {
        text-align: center;
        color: var(--ink);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        line-height: 1.08;
        text-shadow:
          0 2px 16px rgba(0, 0, 0, 0.85),
          0 0 28px rgba(255, 236, 200, 0.28);
      }
      .txt span {
        display: block;
        width: var(--safe-width);
      }
      #t1.txt {
        font-size: 96px;
      }
    </style>
    <style data-rcg="layers">
      #c-hollow { z-index: 40; }
      #c-rgb { z-index: 40; }
      #c-neg { z-index: 20; }
      #c-shadow { z-index: 40; }
      #c-neg-neon { z-index: 20; }
      #c-tier-shadow { z-index: 40; }
      #c-kin { z-index: 40; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="11.2"
      data-width="1080"
      data-height="1920"
    >
      <!-- Shots: one untimed wrapper per clip; the video element carries the timing. -->
      <div id="w1" class="shot">
        <video
          id="v1"
          class="clip"
          src="assets/Video_for_testing.mp4"
          data-start="0"
          data-duration="11.2"
          data-media-start="0"
          data-track-index="0"
          muted
          playsinline
        ></video>
      <!-- rcg:pnp p1 begin (tools/blocks/pnp.mjs; regenerate instead of editing) -->
      <div id="p1-follow" class="shot rcg-pnp-follow" data-rcg="pnp" style="z-index: 30; pointer-events: none; transform-origin: 50% 50%;">
        <div id="p1-wrap" class="rcg-pnp" style="position: absolute; inset: 0; opacity: 0;">
          <video id="p1" class="clip" src="assets/matte/v1-fg.webm" data-start="0" data-duration="11.2" data-media-start="0" data-track-index="60" muted playsinline></video>
        </div>
      </div>
      <!-- rcg:pnp p1 end -->
      </div>

      <!-- Audio goes here. Every audio element needs an id or it is not mixed, and its
           volume lane values are absolute levels. Examples: .claude/skills/video-job/SKILL.md.
           (No example markup in comments: HyperFrames lint reads it as real clips.) -->
      <div id="c-hollow" data-composition-id="c-hollow" data-composition-src="compositions/c-hollow.html" data-start="0" data-duration="3.11" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="c-rgb" data-composition-id="c-rgb" data-composition-src="compositions/c-rgb.html" data-start="0" data-duration="3.11" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="c-neg" data-layout-allow-occlusion data-composition-id="c-neg" data-composition-src="compositions/c-neg.html" data-start="0" data-duration="3.11" data-track-index="30" data-width="1080" data-height="1920" style="mix-blend-mode: difference"></div>
      <div id="c-shadow" data-composition-id="c-shadow" data-composition-src="compositions/c-shadow.html" data-start="3.1" data-duration="3.11" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="c-tier-shadow" data-composition-id="c-tier-shadow" data-composition-src="compositions/c-tier-shadow.html" data-start="3.1" data-duration="3.11" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="c-kin" data-composition-id="c-kin" data-composition-src="compositions/c-kin.html" data-start="6.1" data-duration="5.06" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="c-neg-neon" data-layout-allow-occlusion data-composition-id="c-neg-neon" data-composition-src="compositions/c-neg-neon.html" data-start="3.1" data-duration="3.11" data-track-index="30" data-width="1080" data-height="1920" style="mix-blend-mode: difference"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Text card: ease in, slow drift, fade out before the clip ends.

      // rcg:pnp p1 begin (generated by tools/blocks/pnp.mjs; regenerate instead of editing)
      (function () {
        var follow = document.getElementById("p1-follow");
        var wrap = document.getElementById("p1-wrap");
        var FOLLOW = null;
        var DUR = 11.2;
        // Copy the base shot's camera pose (rcg camera registers it) every frame.
        function apply(t) {
          var f = FOLLOW && window.RCGCamPoses && window.RCGCamPoses[FOLLOW];
          if (!f) return;
          var c = f(t);
          follow.style.transform = c.transform;
          follow.style.filter = c.filter;
        }
        var drv = { _t: 0 };
        Object.defineProperty(drv, "t", { get: function () { return this._t; }, set: function (v) { this._t = v; apply(v); } });
        tl.to(drv, { t: DUR, duration: DUR, ease: "none" }, 0);
        apply(0);
        tl.set(wrap, { x: 0, y: 0, scaleX: 1, scaleY: 1, rotation: 0, opacity: 0, transformOrigin: "50% 50%" }, 0);
        tl.fromTo(wrap, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, 0);
        tl.to(wrap, { opacity: 0, duration: 0.3, ease: "power2.in" }, 10.9);
      })();
      // rcg:pnp p1 end
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
