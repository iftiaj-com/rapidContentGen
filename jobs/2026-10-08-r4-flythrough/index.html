<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      rapidContentGen vertical template (9:16, Reels / Shorts / TikTok).
      Built from the mop-star-trailer job. Conventions:
        - Text never enters the bottom 20% (y >= 1536) or the right 180 px (x >= 900):
          that is where the app buttons and caption UI sit. The text safe box is
          x 64..900 (width 836); the top 192 px is kept clear for the app header.
        - Text cards are FLAT: the .clip element holds the spans directly
          (no nested div), and GSAP animates the spans, never the .clip.
        - Footage sits in an untimed .shot wrapper; camera moves animate the wrapper.
        - Comments in this file never contain literal tags (a regex edit once
          matched a tag inside a comment and commented out the footage).
        - Audio: a data-automation volume lane gives ABSOLUTE levels and overrides
          data-volume. Check the mix with `node tools/rcg.mjs mix-check index.html`
          before rendering.
      Replace JOB_DURATION, the shot list, cards and audio for each job.
    -->
    <style>
      :root {
        --safe-left: 64px;
        --safe-width: 836px;
        --band-top: 220px;
        --band-height: 200px;
        --ink: #f4efe4;
        --font-display: "EB Garamond", Garamond, serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: var(--font-display);
      }
      .shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 50% 40%;
      }
      .shot video,
      .shot img {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .bar {
        position: absolute;
        left: 0;
        width: 1080px;
        background: #000;
        z-index: 50;
      }
      #bar-top {
        top: 0;
        height: 192px;
      }
      #bar-bottom {
        top: 1536px;
        height: 384px;
      }
      .card {
        position: absolute;
        left: var(--safe-left);
        width: var(--safe-width);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 60;
      }
      .card.center {
        top: 660px;
        height: 400px;
      }
      .card.top {
        top: var(--band-top);
        height: var(--band-height);
      }
      .txt {
        text-align: center;
        color: var(--ink);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        line-height: 1.08;
        text-shadow:
          0 2px 16px rgba(0, 0, 0, 0.85),
          0 0 28px rgba(255, 236, 200, 0.28);
      }
      .txt span {
        display: block;
        width: var(--safe-width);
      }
      #t1.txt {
        font-size: 96px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13.72"
      data-width="1080"
      data-height="1920"
    >
      <div id="fly-r4" data-composition-id="fly-r4" data-composition-src="compositions/fly-r4.html" data-start="0" data-duration="13.72" data-track-index="2" data-width="1080" data-height="1920"></div>
      <audio id="fly-r4-music" src="assets/song-limited.wav" data-start="0" data-duration="13.72" data-media-start="0" data-track-index="20"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.02,"v":1},{"t":0.19,"v":1},{"t":0.34,"v":0.5},{"t":0.91,"v":0.5},{"t":1.36,"v":1},{"t":3.88,"v":1},{"t":4.03,"v":0.5},{"t":4.6,"v":0.5},{"t":5.05,"v":1},{"t":7.22,"v":1},{"t":7.37,"v":0.5},{"t":7.94,"v":0.5},{"t":8.39,"v":1},{"t":10.64,"v":1},{"t":10.79,"v":0.5},{"t":11.36,"v":0.5},{"t":11.81,"v":1},{"t":12.72,"v":1},{"t":13.72,"v":0}]}]}'></audio>
      <audio id="fly-r4-sfx-0" src="assets/sfx/whoosh-short.mp3" data-start="0.340" data-duration="0.57" data-volume="0.45" data-track-index="30"></audio>
      <audio id="fly-r4-sfx-2" src="assets/sfx/whoosh-short.mp3" data-start="4.030" data-duration="0.57" data-volume="0.45" data-track-index="32"></audio>
      <audio id="fly-r4-sfx-4" src="assets/sfx/whoosh-short.mp3" data-start="7.370" data-duration="0.57" data-volume="0.45" data-track-index="34"></audio>
      <audio id="fly-r4-sfx-6" src="assets/sfx/whoosh-short.mp3" data-start="10.790" data-duration="0.57" data-volume="0.45" data-track-index="36"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Text card: ease in, slow drift, fade out before the clip ends.
      function card(sel, start, dur) {
        const el = sel + " > span";
        tl.fromTo(el, { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, start);
        tl.to(el, { scale: 0.97, duration: dur - 0.45, ease: "none" }, start + 0.45);
        tl.to(el, { opacity: 0, duration: 0.25, ease: "power1.in" }, start + dur - 0.25);
      }
      
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
