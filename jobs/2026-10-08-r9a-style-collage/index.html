<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      rapidContentGen vertical template (9:16, Reels / Shorts / TikTok).
      Built from the mop-star-trailer job. Conventions:
        - Text never enters the bottom 20% (y >= 1536) or the right 180 px (x >= 900):
          that is where the app buttons and caption UI sit. The text safe box is
          x 64..900 (width 836); the top 192 px is kept clear for the app header.
        - Text cards are FLAT: the .clip element holds the spans directly
          (no nested div), and GSAP animates the spans, never the .clip.
        - Footage sits in an untimed .shot wrapper; camera moves animate the wrapper.
        - Comments in this file never contain literal tags (a regex edit once
          matched a tag inside a comment and commented out the footage).
        - Audio: a data-automation volume lane gives ABSOLUTE levels and overrides
          data-volume. Check the mix with `node tools/rcg.mjs mix-check index.html`
          before rendering.
      Replace JOB_DURATION, the shot list, cards and audio for each job.
    -->
    <style>
      :root {
        --safe-left: 64px;
        --safe-width: 836px;
        --band-top: 220px;
        --band-height: 200px;
        --ink: #f4efe4;
        --font-display: "EB Garamond", Garamond, serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: var(--font-display);
      }
      .shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 50% 40%;
      }
      .shot video,
      .shot img {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .bar {
        position: absolute;
        left: 0;
        width: 1080px;
        background: #000;
        z-index: 50;
      }
      #bar-top {
        top: 0;
        height: 192px;
      }
      #bar-bottom {
        top: 1536px;
        height: 384px;
      }
      .card {
        position: absolute;
        left: var(--safe-left);
        width: var(--safe-width);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 60;
      }
      .card.center {
        top: 660px;
        height: 400px;
      }
      .card.top {
        top: var(--band-top);
        height: var(--band-height);
      }
      .txt {
        text-align: center;
        color: var(--ink);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        line-height: 1.08;
        text-shadow:
          0 2px 16px rgba(0, 0, 0, 0.85),
          0 0 28px rgba(255, 236, 200, 0.28);
      }
      .txt span {
        display: block;
        width: var(--safe-width);
      }
      #t1.txt {
        font-size: 96px;
      }
    </style>
      <style data-rcg-style="tactile-collage">
      @font-face {
        font-family: "TPC Marker";
        src: url("assets/fonts/permanent-marker-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "TPC Courier";
        src: url("assets/fonts/courier-prime-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }
      :root { --paper: #f3e8cc; --sheet: #fffaf0; --ink: #25231f; --primary: #3159c8; --signal: #d95b45; --spark: #e2b93f; --resolve: #58aa8d; --shadow: rgba(37, 35, 31, 0.22); }
    </style>
    <style data-rcg="layers">
      #cap-vo4 { z-index: 40; }
      #h2 { z-index: 20; }
      #tg1 { z-index: 40; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1080"
      data-height="1920"
    >
      <!-- Shots: one untimed wrapper per clip; the video element carries the timing. -->
      <div id="w1" class="shot">
        <video
          id="v1"
          class="clip"
          src="assets/Video_for_testing.mp4"
          data-start="0"
          data-duration="12"
          data-media-start="0"
          data-track-index="0"
          muted
          playsinline
        ></video>
      <!-- rcg:pnp p1 begin (tools/blocks/pnp.mjs; regenerate instead of editing) -->
      <div id="p1-follow" class="shot rcg-pnp-follow" data-rcg="pnp" style="z-index: 30; pointer-events: none; transform-origin: 50% 50%;">
        <div id="p1-wrap" class="rcg-pnp" style="position: absolute; inset: 0; opacity: 0;">
          <video id="p1" class="clip" src="assets/matte/v1-fg.webm" data-start="0" data-duration="12" data-media-start="0" data-track-index="60" muted playsinline></video>
        </div>
      </div>
      <!-- rcg:pnp p1 end -->
      </div>

      <!-- Voice: leveled Kokoro lines (rcg voice say + rcg level). -->
      <audio id="vo1" src="assets/voice/vo1.wav" data-start="0.4" data-duration="1.877" data-track-index="22"></audio>
      <audio id="vo2" src="assets/voice/vo2.wav" data-start="3.2" data-duration="1.984" data-track-index="22"></audio>
      <audio id="vo3" src="assets/voice/vo3.wav" data-start="6.5" data-duration="2.027" data-track-index="22"></audio>
      <audio id="vo4" src="assets/voice/vo4.wav" data-start="9.6" data-duration="1.557" data-track-index="22"></audio>
      <div id="h1" data-composition-id="h1" data-composition-src="compositions/h1.html" data-start="0.2" data-duration="2.8" data-track-index="20" data-width="1080" data-height="1920"></div>
      <audio id="h1-sfx" src="assets/sfx/whoosh-short.mp3" data-start="0.23" data-duration="0.57" data-volume="0.18" data-track-index="40"></audio>
      <div id="n1" data-composition-id="n1" data-composition-src="compositions/n1.html" data-start="3.1" data-duration="3.2" data-track-index="20" data-width="1080" data-height="1920"></div>
      <audio id="n1-sfx" src="assets/sfx/whoosh-short.mp3" data-start="3.23" data-duration="0.57" data-volume="0.18" data-track-index="40"></audio>
      <div id="g1" data-composition-id="g1" data-composition-src="compositions/g1.html" data-start="6.3" data-duration="3.15" data-track-index="20" data-width="1080" data-height="1920"></div>
      <div id="cl1" data-composition-id="cl1" data-composition-src="compositions/cl1.html" data-start="6.45" data-duration="2.95" data-track-index="20" data-width="1080" data-height="1920"></div>
      <audio id="cl1-sfx" src="assets/sfx/click-soft.mp3" data-start="7.5" data-duration="0.37" data-volume="0.35" data-track-index="40"></audio>
      <audio id="cl1-sfx2" src="assets/sfx/click-soft.mp3" data-start="8" data-duration="0.37" data-volume="0.35" data-track-index="40"></audio>
      <audio id="cl1-sfx3" src="assets/sfx/click-soft.mp3" data-start="8.5" data-duration="0.37" data-volume="0.35" data-track-index="40"></audio>
      <div id="r1" data-composition-id="r1" data-composition-src="compositions/r1.html" data-start="8" data-duration="1.4" data-track-index="20" data-width="1080" data-height="1920"></div>
      <div id="st1" data-composition-id="st1" data-composition-src="compositions/st1.html" data-start="8.45" data-duration="0.95" data-track-index="20" data-width="1080" data-height="1920"></div>
      <audio id="st1-sfx" src="assets/sfx/impact-bass-1.mp3" data-start="8.63" data-duration="2.12" data-volume="0.12" data-track-index="41"></audio>
      <div id="h2" data-layout-allow-occlusion data-composition-id="h2" data-composition-src="compositions/h2.html" data-start="9.45" data-duration="2.55" data-track-index="20" data-width="1080" data-height="1920"></div>
      <audio id="h2-sfx" src="assets/sfx/whoosh-short.mp3" data-start="9.48" data-duration="0.57" data-volume="0.18" data-track-index="40"></audio>
      <div id="tg1" data-composition-id="tg1" data-composition-src="compositions/tg1.html" data-start="10" data-duration="2" data-track-index="20" data-width="1080" data-height="1920"></div>
      <audio id="tg1-sfx" src="assets/sfx/pop.mp3" data-start="10.22" data-duration="0.72" data-volume="0.2" data-track-index="40"></audio>
      <div id="cap-vo1" data-composition-id="cap-vo1" data-composition-src="compositions/cap-vo1.html" data-start="0.4" data-duration="2.01" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="cap-vo2" data-composition-id="cap-vo2" data-composition-src="compositions/cap-vo2.html" data-start="3.2" data-duration="2.09" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="cap-vo3" data-composition-id="cap-vo3" data-composition-src="compositions/cap-vo3.html" data-start="6.5" data-duration="2.19" data-track-index="30" data-width="1080" data-height="1920"></div>
      <div id="cap-vo4" data-composition-id="cap-vo4" data-composition-src="compositions/cap-vo4.html" data-start="9.6" data-duration="1.67" data-track-index="30" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // rcg:pnp p1 begin (generated by tools/blocks/pnp.mjs; regenerate instead of editing)
      (function () {
        var follow = document.getElementById("p1-follow");
        var wrap = document.getElementById("p1-wrap");
        var FOLLOW = null;
        var DUR = 12;
        // Copy the base shot's camera pose (rcg camera registers it) every frame.
        function apply(t) {
          var f = FOLLOW && window.RCGCamPoses && window.RCGCamPoses[FOLLOW];
          if (!f) return;
          var c = f(t);
          follow.style.transform = c.transform;
          follow.style.filter = c.filter;
        }
        var drv = { _t: 0 };
        Object.defineProperty(drv, "t", { get: function () { return this._t; }, set: function (v) { this._t = v; apply(v); } });
        tl.to(drv, { t: DUR, duration: DUR, ease: "none" }, 0);
        apply(0);
        tl.set(wrap, { x: 0, y: 0, scaleX: 1, scaleY: 1, rotation: 0, opacity: 0, transformOrigin: "50% 50%" }, 0);
        tl.set(wrap, { opacity: 1 }, 9.4);
        tl.set(wrap, { opacity: 0 }, 12);
      })();
      // rcg:pnp p1 end
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
