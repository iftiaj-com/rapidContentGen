        width: 1080px;
        height: 1920px;

        background: #000;
      }
      #root {

        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: var(--font-display);
      }
      .shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 50% 40%;

      .shot video,

        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;

      }
      .bar {
        position: absolute;
        left: 0;
        width: 1080px;
        background: #000;
        z-index: 50;
      }
      #bar-top {
        top: 0;
        height: 192px;
      }
      #bar-bottom {
        top: 1536px;
        height: 384px;
      }
      .card {
        position: absolute;
        left: var(--safe-left);
        width: var(--safe-width);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 60;
      }
      .card.center {
        top: 660px;
        height: 400px;
      }
      .card.top {
        top: var(--band-top);
        height: var(--band-height);
      }
      .txt {
        text-align: center;
        color: var(--ink);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        line-height: 1.08;
        text-shadow:
          0 2px 16px rgba(0, 0, 0, 0.85),
          0 0 28px rgba(255, 236, 200, 0.28);

      .txt span {
        display: block;
        width: var(--safe-width);

      #t1.txt {
