<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      rapidContentGen vertical template (9:16, Reels / Shorts / TikTok).
      Built from the mop-star-trailer job. Conventions:
        - Text never enters the bottom 20% (y >= 1536) or the right 180 px (x >= 900):
          that is where the app buttons and caption UI sit. The text safe box is
          x 64..900 (width 836); the top 192 px is kept clear for the app header.
        - Text cards are FLAT: the .clip element holds the spans directly
          (no nested div), and GSAP animates the spans, never the .clip.
        - Footage sits in an untimed .shot wrapper; camera moves animate the wrapper.
        - Comments in this file never contain literal tags (a regex edit once
          matched a tag inside a comment and commented out the footage).
        - Audio: a data-automation volume lane gives ABSOLUTE levels and overrides
          data-volume. Check the mix with `node tools/rcg.mjs mix-check index.html`
          before rendering.
      Replace JOB_DURATION, the shot list, cards and audio for each job.
    -->
    <style>
      :root {
        --safe-left: 64px;
        --safe-width: 836px;
        --band-top: 220px;
        --band-height: 200px;
        --ink: #f4efe4;
        --font-display: "EB Garamond", Garamond, serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: var(--font-display);
      }
      .shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 50% 40%;
      }
      .shot video,
      .shot img {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .bar {
        position: absolute;
        left: 0;
        width: 1080px;
        background: #000;
        z-index: 50;
      }
      #bar-top {
        top: 0;
        height: 192px;
      }
      #bar-bottom {
        top: 1536px;
        height: 384px;
      }
      .card {
        position: absolute;
        left: var(--safe-left);
        width: var(--safe-width);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 60;
      }
      .card.center {
        top: 660px;
        height: 400px;
      }
      .card.top {
        top: var(--band-top);
        height: var(--band-height);
      }
      .txt {
        text-align: center;
        color: var(--ink);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        line-height: 1.08;
        text-shadow:
          0 2px 16px rgba(0, 0, 0, 0.85),
          0 0 28px rgba(255, 236, 200, 0.28);
      }
      .txt span {
        display: block;
        width: var(--safe-width);
      }
      #t1.txt {
        font-size: 96px;
      }
      #card {
        position: absolute;
        left: 220px;
        top: 560px;
        width: 640px;
        height: 1138px;
        border-radius: 44px;
        overflow: hidden;
        z-index: 10;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 3px rgba(255, 255, 255, 0.18);
      }
      #card video {
        position: absolute;
        left: 0;
        top: 0;
        width: 640px;
        height: 1138px;
        object-fit: cover;
      }
      #sh-bg { z-index: 0; }
      #flash { z-index: 20; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <!-- Footage card: one untimed wrapper; each segment video carries its own timing.
           Cuts land on the song's downbeats (data/audiomap.json). -->
      <div id="card">
          <video id="seg0" class="clip" src="assets/101066-video-1080.mp4" data-start="0" data-duration="0.511" data-media-start="0" data-track-index="1" muted playsinline></video>
          <video id="seg1" class="clip" src="assets/101066-video-1080.mp4" data-start="0.511" data-duration="1.881" data-media-start="1.9" data-track-index="1" muted playsinline></video>
          <video id="seg2" class="clip" src="assets/101066-video-1080.mp4" data-start="2.392" data-duration="1.811" data-media-start="3.6" data-track-index="1" muted playsinline></video>
          <video id="seg3" class="clip" src="assets/101066-video-1080.mp4" data-start="4.203" data-duration="1.672" data-media-start="5.9" data-track-index="1" muted playsinline></video>
          <video id="seg4" class="clip" src="assets/101066-video-1080.mp4" data-start="5.875" data-duration="1.671" data-media-start="8" data-track-index="1" muted playsinline></video>
          <video id="seg5" class="clip" src="assets/101066-video-1080.mp4" data-start="7.546" data-duration="1.765" data-media-start="10.5" data-track-index="1" muted playsinline></video>
          <video id="seg6" class="clip" src="assets/101066-video-1080.mp4" data-start="9.311" data-duration="1.649" data-media-start="0.6" data-track-index="1" muted playsinline></video>
          <video id="seg7" class="clip" src="assets/101066-video-1080.mp4" data-start="10.96" data-duration="1.765" data-media-start="4.4" data-track-index="1" muted playsinline></video>
          <video id="seg8" class="clip" src="assets/101066-video-1080.mp4" data-start="12.725" data-duration="1.764" data-media-start="6.6" data-track-index="1" muted playsinline></video>
          <video id="seg9" class="clip" src="assets/101066-video-1080.mp4" data-start="14.489" data-duration="0.511" data-media-start="11.9" data-track-index="1" muted playsinline></video>
      </div>
      <audio id="music" src="assets/song-limited.wav" data-start="0" data-duration="15" data-track-index="20"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.04,"v":1},{"t":14.4,"v":1},{"t":15,"v":0}]}]}'></audio>
      <div id="sh-bg" data-composition-id="sh-bg" data-composition-src="compositions/sh-bg.html" data-start="0" data-duration="15" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="flash" data-composition-id="flash" data-composition-src="compositions/flash.html" data-start="0" data-duration="15" data-track-index="35" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Text card: ease in, slow drift, fade out before the clip ends.
      function card(sel, start, dur) {
        const el = sel + " > span";
        tl.fromTo(el, { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, start);
        tl.to(el, { scale: 0.97, duration: dur - 0.45, ease: "none" }, start + 0.45);
        tl.to(el, { opacity: 0, duration: 0.25, ease: "power1.in" }, start + dur - 0.25);
      }
            tl.fromTo("#card", { scale: 1.045 }, { scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 0.511);
      tl.fromTo("#card", { scale: 1.045 }, { scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 2.392);
      tl.fromTo("#card", { scale: 1.045 }, { scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 4.203);
      tl.fromTo("#card", { scale: 1.045 }, { scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 5.875);
      tl.fromTo("#card", { scale: 1.045 }, { scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 7.546);
      tl.fromTo("#card", { scale: 1.045 }, { scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 9.311);
      tl.fromTo("#card", { scale: 1.045 }, { scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 10.96);
      tl.fromTo("#card", { scale: 1.045 }, { scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 12.725);
      tl.fromTo("#card", { scale: 1.045 }, { scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 14.489);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
