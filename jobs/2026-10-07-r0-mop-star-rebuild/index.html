<!doctype html>
<html lang="en">
  <head>
    <!-- R0 regression: mop-star trailer rebuilt through the rapidContentGen workflow. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: "EB Garamond", Garamond, serif;
      }

      /* Footage: full-frame shots, each inside an untimed wrapper that carries camera moves. */
      .shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 50% 40%;
      }
      .shot video,
      .shot img {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }

      /* Letterbox: bottom bar covers the bottom 20% (Reels UI zone). */
      .bar {
        position: absolute;
        left: 0;
        width: 1080px;
        background: #000;
        z-index: 50;
      }
      #bar-top {
        top: 0;
        height: 192px;
      }
      #bar-bottom {
        top: 1536px;
        height: 384px;
      }

      /* Text safe box: x 64..900 (clear of the right-edge buttons). */
      .card {
        position: absolute;
        left: 64px;
        width: 836px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 60;
      }
      .card.center {
        top: 660px;
        height: 400px;
      }
      .card.top {
        top: 220px;
        height: 200px;
      }
      .txt {
        text-align: center;
        color: #f4efe4;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        line-height: 1.08;
        text-shadow:
          0 2px 16px rgba(0, 0, 0, 0.85),
          0 0 28px rgba(255, 236, 200, 0.28);
      }
      .txt span {
        display: block;
        width: 836px;
      }
      #t1.txt { font-size: 84px; }
      #t2.txt { font-size: 110px; }
      #t3.txt { font-size: 92px; }
      #t4.txt { font-size: 84px; }
      #t5.txt { font-size: 76px; }
      #t6.txt {
        font-size: 190px;
        letter-spacing: 0.1em;
        line-height: 0.95;
        color: #f7e7c4;
        text-shadow:
          0 0 36px rgba(255, 210, 140, 0.45),
          0 2px 18px rgba(0, 0, 0, 0.9);
      }
      #t7.txt .big {
        font-size: 80px;
      }
      #t7.txt .small {
        font-size: 46px;
        letter-spacing: 0.22em;
        margin-top: 22px;
        color: #d9cfbd;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="16.88"
      data-width="1080"
      data-height="1920"

      <!-- ACT 2: song montage, warm grade, cuts on the beat. -->

        ></video>

      </div>

      <!-- Letterbox bars, on for the whole trailer. -->
      <div id="bar-top" class="bar clip" data-start="0" data-duration="16.88" data-track-index="5"></div>
      <div id="bar-bottom" class="bar clip" data-start="0" data-duration="16.88" data-track-index="5"></div>

      <!-- Title cards -->
      <div id="t1" class="card center txt clip" data-start="0.15" data-duration="1.4" data-track-index="10"><span>In a world</span><span>of endless</span><span>chores</span></div>
      <div id="t2" class="card top txt clip" data-start="1.75" data-duration="1.4" data-track-index="11"><span>One hero</span></div>
      <div id="t3" class="card center txt clip" data-start="3.25" data-duration="0.75" data-track-index="12"><span>Must face</span><span>the music</span></div>
      <div id="t4" class="card top txt clip" data-start="6.05" data-duration="1.17" data-track-index="10"><span>Armed with</span><span>only a mop</span></div>
      <div id="t5" class="card top txt clip" data-start="7.3" data-duration="1.17" data-track-index="11"><span>And one song</span></div>
      <div id="t6" class="card center txt clip" data-start="11.03" data-duration="1.25" data-track-index="12"><span>Mop</span><span>Star</span></div>
      <div id="t7" class="card center txt clip" data-start="15.62" data-duration="1.26" data-track-index="10"><span class="big">Coming soon</span><span class="small">to a living room</span><span class="small">near you</span></div>

      <!-- Sound. Riser source peaks at 3.04s; 4.0s x 0.76 = 3.04, so it crests at 4.00 and cuts. -->
      <audio
        id="sfx-riser"
        src="assets/sfx/riser.mp3"
        data-start="0"
        data-duration="4"
        data-media-start="0"
        data-playback-rate="0.76"
        data-track-index="20"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.8},{"t":3.96,"v":0.8},{"t":4,"v":0}]}]}'
      ></audio>

        src="assets/sfx/impact-bass-1.mp3"
        data-start="11.03"
        data-duration="1.2"
        data-track-index="23"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.32},{"t":0.35,"v":0.26},{"t":1.2,"v":0}]}]}'
      ></audio>
      <audio
        id="sfx-end"
        src="assets/sfx/impact-bass-2.mp3"
        data-start="15.62"
        data-duration="1.26"
        data-track-index="24"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.22},{"t":0.5,"v":0.13},{"t":1.26,"v":0}]}]}'
      ></audio>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Text: ease in, slow drift, quick fade out before the clip ends.
      function card(sel, start, dur) {
        const el = sel + " > span";
        tl.fromTo(el, { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, start);
        tl.to(el, { scale: 0.97, duration: dur - 0.45, ease: "none" }, start + 0.45);
        tl.to(el, { opacity: 0, duration: 0.25, ease: "power1.in" }, start + dur - 0.25);
      }
      card("#t1", 0.15, 1.4);
      card("#t2", 1.75, 1.4);
      card("#t4", 6.05, 1.17);
      card("#t5", 7.3, 1.17);

      // "Must face the music": hold to the hard cut at 4.00, no fade out.
      tl.fromTo("#t3 > span", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 3.25);
      tl.to("#t3 > span", { scale: 0.98, duration: 0.45, ease: "none" }, 3.55);

      // Title slam on the impact.
      tl.fromTo("#t6 > span", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.out" }, 11.03);
      tl.to("#t6 > span", { scale: 1.05, duration: 0.85, ease: "none" }, 11.21);
      tl.to("#t6 > span", { opacity: 0, duration: 0.2, ease: "power1.in" }, 12.06);

      // End card.
      tl.fromTo("#t7 > span", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 15.62);
      tl.to("#t7 > span", { scale: 0.98, duration: 0.96, ease: "none" }, 15.92);

      // Camera: slow push-in on Act 1, impact punch on the drop.
      tl.fromTo("#w1", { scale: 1 }, { scale: 1.08, duration: 1.6, ease: "none" }, 1.6);
      tl.fromTo("#w2", { scale: 1.14 }, { scale: 1, duration: 0.4, ease: "power3.out" }, 4.2);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
