<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      rapidContentGen vertical template (9:16, Reels / Shorts / TikTok).
      Built from the mop-star-trailer job. Conventions:
        - Text never enters the bottom 20% (y >= 1536) or the right 180 px (x >= 900):
          that is where the app buttons and caption UI sit. The text safe box is
          x 64..900 (width 836); the top 192 px is kept clear for the app header.
        - Text cards are FLAT: the .clip element holds the spans directly
          (no nested div), and GSAP animates the spans, never the .clip.
        - Footage sits in an untimed .shot wrapper; camera moves animate the wrapper.
        - Audio: a data-automation volume lane gives ABSOLUTE levels and overrides
          data-volume. Check the mix with `node tools/rcg.mjs mix-check index.html`
          before rendering.
      Replace JOB_DURATION, the shot list, cards and audio for each job.
    -->
    <style>
      :root {
        --safe-left: 64px;
        --safe-width: 836px;
        --band-top: 220px;
        --band-height: 200px;
        --ink: #f4efe4;
        --font-display: "EB Garamond", Garamond, serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: var(--font-display);
      }
      .shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 50% 40%;
      }
      .shot video,
      .shot img {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .bar {
        position: absolute;
        left: 0;
        width: 1080px;
        background: #000;
        z-index: 50;
      }
      #bar-top {
        top: 0;
        height: 192px;
      }
      #bar-bottom {
        top: 1536px;
        height: 384px;
      }
      .card {
        position: absolute;
        left: var(--safe-left);
        width: var(--safe-width);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 60;
      }
      .card.center {
        top: 660px;
        height: 400px;
      }
      .card.top {
        top: var(--band-top);
        height: var(--band-height);
      }
      .txt {
        text-align: center;
        color: var(--ink);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        line-height: 1.08;
        text-shadow:
          0 2px 16px rgba(0, 0, 0, 0.85),
          0 0 28px rgba(255, 236, 200, 0.28);
      }
      .txt span {
        display: block;
        width: var(--safe-width);
      }
      #t1.txt {
        font-size: 96px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <!-- Shots: one untimed wrapper per clip; the <video> carries the timing. -->
      <div id="w1" class="shot">
        <video
          id="v1"
          class="clip"
          src="assets/main.mp4"
          data-start="0"
          data-duration="5"
          data-media-start="0"
          data-track-index="0"
          muted
          playsinline
        ></video>
      </div>

      <!-- Letterbox (optional): delete both bars for full-frame footage. -->
      <div id="bar-top" class="bar clip" data-start="0" data-duration="5" data-track-index="5"></div>
      <div id="bar-bottom" class="bar clip" data-start="0" data-duration="5" data-track-index="5"></div>

      <!-- Text cards: flat, spans inside the clip. -->
      <div id="t1" class="card top txt clip" data-start="0.2" data-duration="2.5" data-track-index="10"><span>Your title</span></div>

      <!-- Audio: every <audio> needs an id or it is not mixed.
      <audio id="music" src="assets/music-limited.wav" data-start="0" data-duration="5" data-track-index="20"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.03,"v":1},{"t":4.5,"v":1},{"t":5,"v":0}]}]}'></audio>
      -->
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Text card: ease in, slow drift, fade out before the clip ends.
      function card(sel, start, dur) {
        const el = sel + " > span";
        tl.fromTo(el, { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, start);
        tl.to(el, { scale: 0.97, duration: dur - 0.45, ease: "none" }, start + 0.45);
        tl.to(el, { opacity: 0, duration: 0.25, ease: "power1.in" }, start + dur - 0.25);
      }
      card("#t1", 0.2, 2.5);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
